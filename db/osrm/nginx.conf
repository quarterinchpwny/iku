server {
  listen 8080;
  server_name _;

  location ~ ^/(route|table|nearest|match|trip|tile|viaroute)/v1/driving/ {
    proxy_pass http://osrm-routed-car:5000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location ~ ^/(route|table|nearest|match|trip|tile|viaroute)/v1/foot/ {
    proxy_pass http://osrm-routed-foot:5000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /health {
    return 200 "ok\n";
  }

  location / {
    return 404;
  }
}
